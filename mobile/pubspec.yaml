name: due_today
description: "DueToday: syllabus parser, priority assignment tracker, and zero-permission calendar sync."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.6.0
  # The Android Gradle setup (AGP 9.1 / Gradle 9.3) matches Flutter 3.47's template.
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  add_2_calendar: ^3.0.0
  http: ^1.2.2
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  share_plus: ^13.3.1
  animations: ^3.0.0
  file_picker: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  # Plus Jakarta Sans (SIL OFL 1.1), the static instances Google Fonts serves.
  # Bundled as a regular family so every FontWeight maps to a real file and
  # the app never fetches fonts at runtime.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
